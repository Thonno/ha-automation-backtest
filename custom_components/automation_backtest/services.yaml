run:
  fields:
    automation:
      example: automation.hallway_lights
      selector:
        entity:
          domain: automation
    config:
      example: |
        triggers:
          - trigger: state
            entity_id: binary_sensor.hallway_motion
            to: "on"
        conditions:
          - condition: numeric_state
            entity_id: sensor.hallway_lux
            below: 30
      selector:
        object:
    days:
      default: 7
      selector:
        number:
          min: 0.1
          max: 90
          step: 0.1
          unit_of_measurement: days
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    include_runs:
      default: true
      selector:
        boolean:
    max_runs:
      default: 200
      selector:
        number:
          min: 1
          max: 5000
          mode: box

compare:
  fields:
    automation:
      example: automation.heating_morning
      selector:
        entity:
          domain: automation
    config:
      selector:
        object:
    config_b:
      required: true
      selector:
        object:
    days:
      default: 7
      selector:
        number:
          min: 0.1
          max: 90
          step: 0.1
          unit_of_measurement: days
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
